<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>BTA Sprite Pickup</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background:#101018; color:#f4f1ff; }
    * { box-sizing:border-box; }
    body { margin:0; }
    header { position:sticky; top:0; z-index:2; padding:22px clamp(16px,4vw,48px); background:#101018ed; border-bottom:1px solid #343044; backdrop-filter:blur(12px); }
    h1 { margin:0 0 5px; font-size:clamp(22px,4vw,32px); }
    p { color:#aaa5bd; margin:0; }
    main { padding:24px clamp(16px,4vw,48px) 60px; max-width:1500px; margin:auto; }
    #status { margin-bottom:18px; font-size:14px; }
    #gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:18px; }
    figure { margin:0; padding:12px; border:1px solid #343044; border-radius:12px; background:#191824; min-width:0; }
    figure img { display:block; width:100%; max-height:620px; object-fit:contain; cursor:zoom-in; border-radius:6px; background-color:#292735; background-image:linear-gradient(45deg,#373545 25%,transparent 25%),linear-gradient(-45deg,#373545 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#373545 75%),linear-gradient(-45deg,transparent 75%,#373545 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    figcaption { padding:10px 2px 0; overflow-wrap:anywhere; font-size:14px; color:#d7d2e5; }
    .empty { padding:32px; border:1px dashed #514b65; border-radius:12px; color:#aaa5bd; }
    dialog { width:min(96vw,1500px); max-width:none; max-height:94vh; padding:12px; border:1px solid #514b65; border-radius:12px; background:#191824; color:#f4f1ff; }
    dialog::backdrop { background:#05040bdc; }
    dialog img { display:block; max-width:100%; max-height:82vh; margin:auto; object-fit:contain; }
    dialog button { display:block; margin:0 0 10px auto; padding:8px 14px; color:inherit; background:#343044; border:0; border-radius:8px; cursor:pointer; }
    a { color:#b9a5ff; }
  </style>
</head>
<body>
  <header>
    <h1>BTA · Sprite Pickup</h1>
    <p>Visual handoff gallery · images are loaded straight from this repository's main branch.</p>
  </header>
  <main>
    <div id="status">Looking for sprite artwork…</div>
    <section id="gallery" aria-live="polite"></section>
  </main>
  <dialog id="viewer"><button id="close" type="button">Close ✕</button><img alt=""><p id="caption"></p></dialog>
  <script>
    const owner = "ItsLeoIso", repo = "gptsp.github.com", branch = "main";
    const gallery = document.querySelector("#gallery"), status = document.querySelector("#status");
    const viewer = document.querySelector("#viewer"), viewerImage = viewer.querySelector("img");
    const imageExt = /\.(png|jpe?g|webp|gif|avif)$/i;
    const raw = path => `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path.split("/").map(encodeURIComponent).join("/")}`;
    async function load() {
      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`, { headers: { Accept: "application/vnd.github+json" } });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const tree = await response.json();
        const files = (tree.tree || []).filter(item => item.type === "blob" && imageExt.test(item.path)).sort((a,b) => a.path.localeCompare(b.path));
        status.textContent = `${files.length} image file${files.length === 1 ? "" : "s"} found · newest repository contents`;
        if (!files.length) { gallery.innerHTML = '<div class="empty">No sprite images found yet. Add PNG, JPG, WEBP, GIF or AVIF files anywhere in the repository.</div>'; return; }
        for (const file of files) {
          const figure = document.createElement("figure"), img = document.createElement("img"), caption = document.createElement("figcaption");
          img.loading = "lazy"; img.src = raw(file.path); img.alt = file.path;
          caption.textContent = file.path;
          img.addEventListener("click", () => { viewerImage.src = img.src; viewerImage.alt = img.alt; document.querySelector("#caption").textContent = file.path; viewer.showModal(); });
          figure.append(img, caption); gallery.append(figure);
        }
      } catch (error) {
        status.textContent = "Couldn't load the GitHub file list.";
        gallery.innerHTML = '<div class="empty">The gallery needs GitHub Pages enabled and access to the GitHub API. You can still browse the <a href="https://github.com/ItsLeoIso/gptsp.github.com/tree/main/Sprites">Sprites folder on GitHub</a>.</div>';
        console.error(error);
      }
    }
    document.querySelector("#close").addEventListener("click", () => viewer.close());
    load();
  </script>
</body>
</html>
